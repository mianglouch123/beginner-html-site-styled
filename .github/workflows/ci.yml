name: CI/CD Multi-Entorno

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # --- JOB 1: CONSTRUIR Y PUBLICAR ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir variables de entorno (Build)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Construir y Publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- JOB 2: DESPLEGAR ---
  deploy:
    needs: build # <--- Espera a que 'build' termine en verde
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Definir variables de entorno (Deploy)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "PORT=8080" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "PORT=8081" >> $GITHUB_ENV
          fi

      - name: Realizar Pull de la imagen Docker
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ env.IMAGE_TAG }}

      - name: Ejecutar contenedor
        run: |
          # Exportar variables para que Docker Compose las lea
          export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ env.IMAGE_TAG }}
          export APP_PORT=${{ env.PORT }}
          export APP_ENV=${{ env.DEPLOY_ENV }}
          # Levantar el contenedor
          docker compose up -d

      - name: Verificar despliegue (Smoke Test)
        run: |
          echo "Esperando a que el contenedor arranque en el puerto ${{ env.PORT }}..."
          sleep 3
          curl -f http://localhost:${{ env.PORT }} || exit 1
          echo "¡El servidor de ${{ env.DEPLOY_ENV }} responde correctamente!"

      - name: Limpiar contenedores e imagenes
        run: |
          docker container prune -f
          docker image prune -af